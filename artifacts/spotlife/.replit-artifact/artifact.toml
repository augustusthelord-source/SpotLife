kind = "web"
previewPath = "/"
title = "SpotLife"
description = "A Dutch nightlife discovery and social platform to find clubs, events, and people nearby."
version = "1.0.0"
id = "artifacts/spotlife"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18262

[services.development]
run = "pnpm --filter @workspace/spotlife run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spotlife", "run", "build" ]
serve = "static"
publicDir = "artifacts/spotlife/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18262"
BASE_PATH = "/"
